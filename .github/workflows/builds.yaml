name: Build

on:
  pull_request:
  push:
    branches: [master, main, dev, develop]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ossia score add-on: dev tree + SDK (latest/continuous) + tag-gated release,
  # in one reusable workflow.
  ci:
    uses: ossia/actions/.github/workflows/score-addon.yml@master
    secrets: inherit
    with:
      # The JIT compiles the add-on's own sources against the score SDK; it
      # cannot build the emulator cores this add-on compiles from its submodules.
      jit: false
